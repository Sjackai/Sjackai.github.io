<!DOCTYPE html>
<!-- document type is a HTML5 document -->

<html lang="en">
<!-- Starts the HTML document -->

<head>
    <!-- This is head containing information about the webpage -->

    <meta charset="UTF-8">
    <!-- Allows the webpage to use different characters -->

    <title>JavaScript Calculator</title>
    <!-- Sets the name that appears on the browser tab -->

    <style>
        /* Styles everything shown in the body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Styles the headings */
        h1, h2 {
            color: #333;
        }

        /* Styles the tables */
        table {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
            background-color: white;
        }

        /* Styles the table boxes */
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        /* Styles the top row of the tables */
        th {
            background-color: #333;
            color: white;
        }

        /* Gives every other row a different background */
        tr:nth-child(even) {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>
    <!-- everything inside the body is shown on the webpage -->

    <h1>JavaScript Calculator</h1>
    <!-- Heading for my calculator -->

    <script src="calculator.js"></script>
    <!-- Loads my JavaScript calculator file -->

</body>
<!-- ends everything displayed on the webpage -->

</html>
